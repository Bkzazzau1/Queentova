services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: queentovah
      POSTGRES_USER: queentovah
      POSTGRES_PASSWORD: queentovah
    ports:
      - "5432:5432"
    volumes:
      - queen_tovah_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queentovah -d queentovah"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  queen_tovah_postgres:
